name: Release

# On-demand release: bump the version, commit, tag, publish to the
# Marketplace, and create a GitHub Release — all in one run.
# Trigger from the Actions tab (or: gh workflow run release.yml -f bump=patch).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump level"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          NEW=$(npm version ${{ github.event.inputs.bump }} -m "chore(release): %s")
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Push commit and tag
        run: git push origin HEAD:main --follow-tags

      - name: Publish to Marketplace
        run: npx --yes @vscode/vsce publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --out "pin-and-hide-${{ steps.bump.outputs.version }}.vsix"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.version }}
          generate_release_notes: true
          files: "*.vsix"
